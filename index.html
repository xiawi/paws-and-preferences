<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Paws & Preferences</title>
		<link rel="stylesheet" href="style.css" />
		<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@400;600;700&display=swap" rel="stylesheet">
		<script type="module" src="js/script.js"></script>
	</head>
	<body>
		<div id="app">
			<div id="topbar">
				<h1 id="title">Paws and Preferences</h1>
				<div id="topbar-actions">
					<div id="tooltip-container">
						<button id="info-btn">?</button>
						<div id="tooltip">Swipe right or press → to like a cat. Swipe left or press ← to pass. See your favourites at the end!</div>
					</div>
					<button id="theme-btn">☀️</button>
				</div>
			</div>
			<div id="loading">
				<p id="loading-text">Fetching cats...</p>
			</div>
			<div id="content">
				<div id="cat-container"></div>
				<div id="counter"></div>
				<div id="summary" style="display: none;"></div>
			</div>
		</div>
	</body>
</html>
